services:
  backend:
    build: .
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      LUPO_DASHBOARD_ORIGIN: http://${PUBLIC_HOST}:${DASHBOARD_PORT:-3000}
    volumes:
      - lupo-data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./lupo-web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${PUBLIC_HOST}:${BACKEND_PORT:-8080}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lupo-data:
